# Kortex: the logo's indigo on calm neutrals, light and dark (follows the viewer's system setting).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.8rem"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1.5rem"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F7F7FB"
secondaryBackgroundColor = "#F4F5FA"
textColor = "#1C2030"
borderColor = "#E4E6EF"
linkColor = "#4F46E5"
codeBackgroundColor = "#F4F5FA"
codeTextColor = "#3730A3"
blueColor = "#2563EB"
greenColor = "#16A34A"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
grayColor = "#6B7280"
dataframeHeaderBackgroundColor = "#F4F5FA"
dataframeBorderColor = "#E3E5EE"

[theme.dark]
primaryColor = "#6366F1"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#171A24"
textColor = "#E8EAF2"
borderColor = "#262B3B"
linkColor = "#A5B4FC"
codeBackgroundColor = "#161A26"
codeTextColor = "#C7D2FE"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
grayColor = "#9CA3AF"
dataframeHeaderBackgroundColor = "#161A26"
dataframeBorderColor = "#262B3B"

[theme.light.sidebar]
backgroundColor = "#F1F2F7"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEF0F7"
textColor = "#111827"
borderColor = "#E3E5EE"
primaryColor = "#4F46E5"
linkColor = "#4F46E5"

[theme.dark.sidebar]
backgroundColor = "#0B0D13"
secondaryBackgroundColor = "#161A26"
codeBackgroundColor = "#161A26"
textColor = "#E8EAF2"
borderColor = "#262B3B"
primaryColor = "#6366F1"
linkColor = "#A5B4FC"

[client]
toolbarMode = "minimal"
