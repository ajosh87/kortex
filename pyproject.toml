[project]
name = "kortex"
version = "0.1.0"
description = "Kortex: the Kubernetes org brain. An agent over a FalkorDB graph of the Kubernetes project (Graph Hacks)."
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "langchain>=1.4.6",
    "langchain-aws>=1.9.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]
